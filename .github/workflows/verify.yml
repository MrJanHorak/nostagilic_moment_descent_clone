name: Verify game

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts, tests, build and audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the declared npm version
        shell: bash
        run: npm install --global "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')"
      - name: Clean install from lockfile
        run: npm ci --no-audit
      - name: Lint, types, regression suite and production build
        run: npm run verify
      - name: Install Chromium and platform dependencies
        run: npx playwright install --with-deps chromium
      - name: Production browser smoke and restart resources
        run: npx playwright test
      - name: Audit all locked dependencies
        run: npm run audit:deps
      - name: Preserve browser reports and resource measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-checks-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
